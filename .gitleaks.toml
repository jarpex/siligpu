title = "siligpu gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Exclude generated artifacts"
paths = [
    '''sbom/''',
    '''target/''',
    '''\.git/''',
    '''THIRD_PARTY_LICENSES\.html''',
    '''README.md''',
]

[[rules]]
id = "generic-password"
description = "Generic password in config"
regex = '''(?i)(password|passwd|pwd)\s*[:=]\s*["']?([a-zA-Z0-9!@#$%^&*_\-]{8,})["']?'''
severity = "medium"
tags = ["password"]
