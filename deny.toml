[graph]
targets = [
    { triple = "aarch64-apple-darwin" },
]
all-features = true

[advisories]
version = 2
ignore = []
unmaintained = "transitive"
yanked = "warn"

# Example
# [[advisories.ignore]]
# id = "RUSTSEC-YYYY-XXXX"
# reason = "something..."

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0"
]
confidence-threshold = 0.93

[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

deny = [
    { name = "GPL-2.0" },
    { name = "GPL-3.0" },
    { name = "AGPL-3.0" },
    { name = "LGPL-2.1" },
    { name = "LGPL-3.0" },
    { name = "SSPL-1.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]